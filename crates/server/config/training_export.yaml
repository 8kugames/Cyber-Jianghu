version: 1
description: "训练数据自动导出配置 (spec 2026-07-25)"
data:
  # 总开关, 默认关闭. 显式开启: TRAINING_EXPORT_ENABLED=true
  enabled: false

  scheduler:
    interval_secs: 21600 # 6h
    run_timeout_secs: 600 # 10min（双层 timeout 内层）
    max_concurrent_runs: 1 # 严格 1, 串行
    manual_enqueue_timeout_secs: 30 # manual queue 等待上限, 超时返回 408
    manual_queue_capacity: 8 # 仅控制排队深度, 不改变 runner 单并发

  limits:
    max_traces_per_run: 50000
    max_total_export_size_gb: 50
    db_batch_size: 10000
    db_statement_timeout_secs: 30 # SET LOCAL 短事务
    yield_every_n: 500

  checkpoint:
    retain_days: 7 # 桶退役

  paths:
    traces_input_subdir: "traces/soul=renhun"
    output_subdir: "training_exports/sft"
    checkpoint_filename: "training_exports/sft_checkpoint.json"
